coreNodeSelector: &coreNodeSelector
  hub.jupyter.org/node-purpose: core
# workloads with persistent storage must go on hyperdisk-capable nodes
persistentNodeSelector: &persistentNodeSelector
  hub.jupyter.org/node-purpose: core
  disk-type.gke.io/hyperdisk-balanced: "true"
jupyterhub:
  proxy:
    chp:
      nodeSelector: *coreNodeSelector
    service:
      type: ClusterIP
  httpRoute:
    enabled: true
    parentRefs:
      - kind: Gateway
        name: default
        namespace: support
  singleuser:
    events: true
    image:
      name: quay.io/jupyter/scipy-notebook
      tag: "2025-10-21"
    memory:
      limit: 2G
      guarantee: 1G
    cpu:
      limit: 1
      guarantee: 0.5
    extraEnv:
      CULL_CONNECTED: "1"
      CULL_TIMEOUT: "1800"
      CULL_KERNEL_TIMEOUT: "1800"
      CULL_INTERVAL: "120"
  prePuller:
    hook:
      enabled: false
    continuous:
      enabled: true
  hub:
    nodeSelector: *persistentNodeSelector
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/path: /hub/metrics
    config:
      JupyterHub:
        authenticate_prometheus: false
        template_paths:
          - /opt/extra_templates
    extraFiles:
      page_template:
        mountPath: /opt/extra_templates/page.html
        stringData: |
          {% extends 'templates/page.html' %}
          {%- block scripts %}
          {{ super() }}
          <script async src="https://siteimproveanalytics.com/js/siteanalyze_6294756.js"></script>
          {%- endblock scripts %}
  scheduling:
    userScheduler:
      enabled: true
    podPriority:
      enabled: true
    userPlaceholder:
      enabled: true
      replicas: 0
    userPods:
      nodeAffinity:
        matchNodePurpose: require
    corePods:
      nodeAffinity:
        matchNodePurpose: require
jupyterhub-home-nfs:
  nodeSelector: *persistentNodeSelector
dask-gateway:
  enabled: false
