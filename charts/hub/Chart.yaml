apiVersion: v2
description: JupyterHub itself
name: hub
version: "0.0.0"
kubeVersion: ">= 1.32.0-0"
dependencies:
  - name: jupyterhub
    version: "4.4.0"
    repository: "https://jupyterhub.github.io/helm-chart"
  - name: jupyterhub-home-nfs
    version: "1.2.0"
    repository: oci://ghcr.io/2i2c-org/jupyterhub-home-nfs
  # Dask Gateway for cluster-in-namespace compute (lightcone-cli's cloud
  # backend). Keep the chart version in lockstep with the dask/distributed/
  # dask-gateway pins in any image that acts as a worker.
  - name: dask-gateway
    version: "2026.3.0"
    repository: "https://helm.dask.org"
    condition: dask-gateway.enabled
