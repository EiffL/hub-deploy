# Lightcone colours and type for the hub pages (charts/hub/files/themes/lightcone,
# packed into the hub-theme ConfigMap by charts/hub/templates/hub-theme.yaml)
hubTheme: lightcone
jupyterhub:
  httpRoute:
    hostnames:
      - lab.lightconeresearch.org
  hub:
    # Persistent workloads are pinned to hyperdisk-capable core nodes
    # (persistentNodeSelector in charts/hub). The cluster default storage
    # class (standard-rwo, pd-balanced) cannot attach to those nodes; use
    # the auto-balanced class from charts/support instead.
    db:
      pvc:
        storageClassName: auto-balanced
        storage: 4Gi # hyperdisk-balanced minimum
    services:
      dask-gateway:
        url: http://traefik-lightcone-dask-gateway
        display: false
    config:
      JupyterHub:
        authenticator_class: github
        public_url: https://lab.lightconeresearch.org
        # theme templates (replaces the chart default /opt/extra_templates,
        # which only carries the BIDS analytics snippet)
        template_paths:
          - /opt/hub-theme
        logo_file: /opt/hub-theme/logo.svg
      OAuthenticator:
        oauth_callback_url: https://lab.lightconeresearch.org/hub/oauth_callback
      GitHubOAuthenticator:
        # access controlled by allowed_users/admin_users in access.json
        # (data in config.enc.yaml); the org/team gating in _common is
        # Berkeley-specific, override it away here
        allowed_organizations: []
        admin_groups: []
    extraVolumes:
      - name: hub-theme
        configMap:
          name: hub-theme
    extraVolumeMounts:
      - name: hub-theme
        mountPath: /opt/hub-theme
        readOnly: true
      - name: hub-theme
        mountPath: /usr/local/share/jupyterhub/static/theme
        readOnly: true
  singleuser:
    # match lightcone.user_service_account in tf/clusters/lightcone/main.tf
    serviceAccountName: lightcone-hub-user
    extraEnv:
      # lightcone-cli image-build contract (tf/modules/lightcone/cloudbuild.tf):
      # content-addressed project images are built by GCP Cloud Build from
      # a staged-context tarball (no git involved) and pushed here.
      LIGHTCONE_REGISTRY: europe-west1-docker.pkg.dev/lightconehub/lightcone-cloudbuild-images
      LIGHTCONE_BUILD_BUCKET: lightconehub-lightcone-lc-build
      LIGHTCONE_BUILD_SERVICE_ACCOUNT: lightcone-lc-build@lightconehub.iam.gserviceaccount.com
      # dask gateway
      DASK_GATEWAY__ADDRESS: http://traefik-lightcone-dask-gateway/services/dask-gateway
      DASK_GATEWAY__PROXY_ADDRESS: gateway://traefik-lightcone-dask-gateway:80
jupyterhub-home-nfs:
  gke:
    volumeId: projects/lightconehub/zones/europe-west1-b/disks/hub-nfs-lightcone
