gateway:
  # need to specify each hostname individually on the gateway
  # for cert-manager
  hostnames:
    - hub-grafana.lightconeresearch.org
    - hub-prometheus.lightconeresearch.org
    - lab.lightconeresearch.org
  config:
    provider:
      kubernetes:
        envoyService:
          annotations:
            # preserve ip when gateway service gets recreated
            cloud.google.com/l4-rbs: "enabled"
            networking.gke.io/load-balancer-ip-addresses: "lightcone-ingress"
grafana:
  # pinned to hyperdisk core nodes (persistentNodeSelector in charts/support):
  # the cluster default pd-balanced class cannot attach there
  persistence:
    storageClassName: auto-balanced
    size: 4Gi # hyperdisk-balanced minimum
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_name: Lightcone
      org_role: Viewer
    auth.basic:
      enabled: true
  route:
    main:
      hostnames:
        - hub-grafana.lightconeresearch.org
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: prometheus
          orgId: 1
          type: prometheus
          url: https://hub-prometheus.lightconeresearch.org
          isDefault: true
          editable: false
prometheus:
  server:
    persistentVolume:
      storageClass: auto-balanced
    route:
      main:
        hostnames:
          - hub-prometheus.lightconeresearch.org
